name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project if zip uploaded
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -o *.zip
          if [ ! -f "build.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle.kts" -exec dirname {} \;)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -r $SUBDIR/* .
            fi
          fi
        fi

    - name: Fix gradle properties for CI
      run: |
        if [ -f "gradle.properties" ]; then
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
          sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/g' gradle.properties
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        cache-disabled: true

    - name: Build Debug APK
      run: gradle assembleDebug --no-configuration-cache --no-build-cache --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: InfoFinder-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
